<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Pousada da Nita</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=21">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    /* O styles.css prepara o body para o layout do app (sidebar + conteúdo); aqui ele é uma tela única centralizada. */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: auto;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: auto;
      padding: 1.5rem;
      background: var(--sidebar-bg-gradient);
    }

    .login-container {
      background-color: var(--bg-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 400px;
      overflow: hidden;
      animation: login-in 0.5s var(--ease-out) both;
    }

    @keyframes login-in {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* A faixa tem a mesma cor de fundo do logo (#0b212e), então o logo se funde com ela */
    .login-brand {
      background-color: #0b212e;
      display: flex;
      justify-content: center;
      padding: 1.25rem 1.5rem 0.5rem;
    }
    .login-logo {
      display: block;
      width: 100%;
      max-width: 220px;
      height: auto;
    }

    .login-body {
      padding: 2rem 2.25rem 2.25rem;
    }

    .login-body h1 {
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 0.25rem;
    }
    .login-lead {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .login-error {
      display: none;
      background-color: #fef2f2;
      color: var(--danger-text);
      border: 1px solid #fecaca;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      line-height: 1.4;
      margin-bottom: 1.25rem;
    }

    .btn-login {
      width: 100%;
      min-height: 48px;
      padding: 0.875rem;
      background-color: var(--primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 1rem;
      margin-top: 0.5rem;
    }
    .btn-login:hover:not(:disabled) { background-color: var(--primary-hover); }

    .login-help {
      margin-top: 1.25rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
    }

    @media (max-width: 420px) {
      .login-body { padding: 1.5rem 1.25rem 1.75rem; }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-brand">
      <img src="logo.png" alt="Pousada da Nita" class="login-logo" width="652" height="441" onerror="this.style.display='none'">
    </div>

    <div class="login-body">
      <h1>Acesso ao sistema</h1>
      <p class="login-lead">Entre com o seu e-mail e a sua senha.</p>

      <div id="loginError" class="login-error" role="alert" aria-live="assertive">Credenciais inválidas.</div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="voce@exemplo.com">
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Digite sua senha">
        </div>
        <button type="submit" class="btn-login" id="loginBtn">Entrar</button>
      </form>

      <p class="login-help" id="recoverLink">Esqueceu a senha? Fale com o administrador do sistema.</p>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
